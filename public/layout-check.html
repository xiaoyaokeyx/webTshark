<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WebTshark 响应式布局检查</title>
  <style>
    body {
      margin: 0;
      background: #e8edf5;
      color: #243b5b;
      font: 14px system-ui;
    }
    header {
      padding: 12px 20px;
      background: white;
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    select {
      padding: 8px;
      border: 1px solid #ced9e9;
      border-radius: 5px;
    }
    main {
      padding: 16px;
      overflow: auto;
    }
    iframe {
      display: block;
      width: 390px;
      height: 780px;
      border: 1px solid #bac8dd;
      background: white;
      margin: auto;
      box-shadow: 0 5px 22px #243e611a;
    }
    small {
      color: #71839b;
    }
  </style>
  <header>
    <strong>真实页面布局检查</strong
    ><label
      >视口宽度
      <select id="width" aria-label="检查宽度">
        <option value="390">390 px</option>
        <option value="768">768 px</option>
        <option value="1024">1024 px</option>
        <option value="1280">1280 px</option>
      </select></label
    ><small>加载同源工作台；用于开发验收，数据与主工作台相同。</small>
  </header>
  <main><iframe src="/" title="工作台布局预览"></iframe></main>
  <script>
    document.getElementById("width").addEventListener("change", (event) => {
      document.querySelector("iframe").style.width = `${event.target.value}px`;
    });
  </script>
</html>
